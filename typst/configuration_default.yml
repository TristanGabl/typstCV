projects:
    - name: 'Cloth folding using a diffusion policy on a SO-101'
      course: 'Robot Learning'
      link: 'https://github.com/TristanGabl/lerobot_robot_learning'
      link_note: ''
      note: ''
      points:
          - 'Established a data collection workflow for imitation learning, used to train and verify diffusion policies.'
          - "Refactored the codebase to add support for Meta's DINOv3 vision backbone and a lighter flow matching model without the text encoder, matching or outperforming the CNN-based diffusion policy with 1/5 of the parameters and enabling rollouts on a standard M1 Mac."
          - "Generalised the policy to arbitrary towel colours by segmenting the towel in every recorded frame with SAM 2 and adding a colour-changing data transform to LeRobot, combined with a dataset of varied offsets and rotations."

    - name: 'CuSSS: Cuda implementation of SSS variants'
      course: 'Large-Scale AI Engineering'
      link: 'https://github.com/ucinereo/CuSSS'
      link_note: ''
      note: 'Awarded a letter of distinction'
      points:
          - 'Implemented native Cuda kernels for variants of SSS activation functions, focused on runtime.'
          - 'Validated kernels against PyTorch autograd equivalents and verified speedups using benchmarks and Nsight Systems profiling.'

    - name: 'Action recognition using 3D hand-object contact maps'
      course: '3D Vision'
      link: 'https://github.com/TristanGabl/3d_vision'
      link_note: ''
      note: ''
      points:
          - 'Predicted performed actions from short sequences of hand and object vertices on the egocentric H2O dataset.'
          - 'Compared two-stage and end-to-end training of MLP and transformer models, using thresholded contact and distance maps as an intermediate representation.'

    - name: "Software pipeline for 3D scene graphs"
      course: "Bachelor's thesis"
      link: 'https://github.com/TristanGabl/3dscenegraph_demo'
      link_note: ''
      note: ''
      points:
          - 'Developed code for combining point clouds, 2D panoptic segmentation, and MLP output to produce 3D scene graphs.'
          - "Separated object instances on the mesh using connectivity, best-view re-projection of Mask2Former instances for duplicate removal, and BFS assignment of leftover vertices; evaluated with semantic and instance mIoU on ScanNet scenes."
          - "Compiled a relationship dataset from 3RScan/3DSSG and trained an embedding-based MLP to predict relations between objects; results shown in an interactive Plotly viewer."

